# A release of the app: a version's APK, signed with the project's key, published on GitHub
# with the version's notes (docs/releases.md). The app looks there for its updates.
#
# The key is not on GitHub: whoever keeps it builds the APK (docs/releases.md) and hands it to
# this workflow as release/acww-kor-port-<version>.apk on the ref the workflow is run on. The
# workflow checks that it is that version, signed with the project's key, and publishes it.
# (With the key in the RELEASE_KEYSTORE_BASE64 secret, and no APK handed in, the workflow
# builds and signs one itself.)
#
# Run by hand (Actions, "release", "Run workflow"), or by pushing the tag "v<version>".
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      target:
        description: The commit the APK was built from (the release's tag is put on it); the run's own without
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      ACWW_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      ACWW_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      ACWW_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      TARGET: ${{ inputs.target }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: The version, and where its APK comes from
        run: |
          version=$(cat port/VERSION)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TARGET=${TARGET:-$GITHUB_SHA}" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::the tag is $GITHUB_REF_NAME and port/VERSION says $version"
            exit 1
          fi
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "::error::v$version is released already"
            exit 1
          fi
          # an update installs only over an app signed with the same key: every release has
          # to be signed with the one the first was (docs/releases.md)
          if [ -f "release/acww-kor-port-$version.apk" ]; then
            echo "MODE=handed-in" >> "$GITHUB_ENV"
          elif [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "MODE=build" >> "$GITHUB_ENV"
          else
            echo "::error::nothing to release: no release/acww-kor-port-$version.apk on this ref, and no key to build one with (docs/releases.md)"
            exit 1
          fi
          # (unset secrets are empty, not absent: the build's own defaults then)
          [ -n "$ACWW_KEYSTORE_PASSWORD" ] || echo "ACWW_KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
          [ -n "$ACWW_KEY_ALIAS" ] || echo "ACWW_KEY_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
          [ -n "$ACWW_KEY_PASSWORD" ] || echo "ACWW_KEY_PASSWORD=android" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: SDL2 source
        if: env.MODE == 'build'
        run: git clone --depth 1 --branch release-2.30.9 https://github.com/libsdl-org/SDL.git android/SDL
      - name: NDK and CMake
        if: env.MODE == 'build'
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null
      - name: Build the APK
        if: env.MODE == 'build'
        working-directory: android
        run: |
          ./gradlew --no-daemon assembleRelease -PreleaseKeystore="$RUNNER_TEMP/release.keystore"
          rm -f "$RUNNER_TEMP/release.keystore"
          mkdir -p ../release
          cp app/build/outputs/apk/release/app-release.apk "../release/acww-kor-port-$VERSION.apk"
      - name: This version of the app, signed with the project's key
        run: |
          apk="acww-kor-port-$VERSION.apk"
          cp "release/$apk" "$apk"
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          # (what a signer's line begins with differs between versions of the tool)
          "$tools/apksigner" verify --print-certs "$apk" | tee certificates.txt
          is=$(sed -n 's/^Signer.* certificate SHA-256 digest: //p' certificates.txt | sort -u)
          want=$(tr -d ' \n' < android/release-key.sha256)
          if [ "$is" != "$want" ]; then
            echo "::error::signed with $is, and the project's key is $want: this APK would not install as an update"
            exit 1
          fi
          badging=$("$tools/aapt2" dump badging "$apk" | head -1)
          case "$badging" in
            *"name='io.github.cailet0422.acwwkor'"*"versionName='$VERSION'"*) ;;
            *) echo "::error::not version $VERSION of the app: $badging"; exit 1 ;;
          esac
          sha256sum "$apk" > SHA256SUMS
          cat SHA256SUMS
      - name: The version's notes
        run: python3 port/tools/release_notes.py "$VERSION" > notes.md
      - name: Publish
        run: |
          gh release create "v$VERSION" "acww-kor-port-$VERSION.apk" SHA256SUMS \
            --title "acww-kor-port $VERSION" --notes-file notes.md --target "$TARGET"
