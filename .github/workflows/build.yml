# Builds the port on every push: the Linux programs (x86-64 and 32-bit x86) with the ROM-split
# test, and the Android APK (armeabi-v7a and arm64-v8a). No ROM is used or needed; the frame
# check, which needs one, is run by hand (docs/building.md).
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            packages: libsdl2-dev
            toolchain: ""
          - arch: i686
            packages: gcc-multilib g++-multilib libsdl2-dev:i386
            toolchain: linux-i686
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Toolchain and SDL2
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y ninja-build ${{ matrix.packages }}
      - name: Build
        run: |
          TOOLCHAIN="${{ matrix.toolchain }}"
          cmake -S port -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            ${TOOLCHAIN:+-DCMAKE_TOOLCHAIN_FILE=$PWD/port/cmake/$TOOLCHAIN.cmake}
          cmake --build build
      - name: ROM split against the decomp's extract.py
        run: python3 port/tests/test_rom_prep.py build/acww-rom-prep
      - name: Starts and refuses a missing ROM
        run: |
          set +e
          SDL_VIDEODRIVER=dummy build/acww-kor --data "$RUNNER_TEMP/data"
          test $? -eq 1
      - uses: actions/upload-artifact@v4
        with:
          name: acww-kor-linux-${{ matrix.arch }}
          path: build/acww-kor

  # The headless programs for ARM, so the cross builds docs/64bit.md checks stay buildable.
  linux-arm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Cross compilers and qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf qemu-user
      - name: Build and test the ROM split
        run: |
          for arch in aarch64 armhf; do
            cmake -S port -B build-$arch -G Ninja -DCMAKE_BUILD_TYPE=Release -DPORT_FRONT_END=OFF \
              -DCMAKE_TOOLCHAIN_FILE=$PWD/port/cmake/linux-$arch.cmake
            cmake --build build-$arch
          done
          printf '#!/bin/sh\nexec qemu-aarch64 -L /usr/aarch64-linux-gnu build-aarch64/acww-rom-prep "$@"\n' > rom-prep-aarch64
          printf '#!/bin/sh\nexec qemu-arm -L /usr/arm-linux-gnueabihf build-armhf/acww-rom-prep "$@"\n' > rom-prep-armhf
          chmod +x rom-prep-aarch64 rom-prep-armhf
          python3 port/tests/test_rom_prep.py ./rom-prep-aarch64
          python3 port/tests/test_rom_prep.py ./rom-prep-armhf

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: SDL2 source
        run: git clone --depth 1 --branch release-2.30.9 https://github.com/libsdl-org/SDL.git android/SDL
      - name: NDK and CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null
      - name: Build the APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease
      - name: Name it
        run: cp android/app/build/outputs/apk/release/app-release.apk "acww-kor-port-$(cat port/VERSION).apk"
      - uses: actions/upload-artifact@v4
        with:
          name: acww-kor-port-android
          path: acww-kor-port-*.apk
